services:
  painel:
    build: .
    container_name: clm-iptv
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data          # banco de dados
      - ./lista.m3u:/app/lista.m3u:ro
    environment:
      PORT: 8080
      # troque pelo dominio/IP que os clientes vao acessar
      PUBLIC_URL: http://SEU-IP-OU-DOMINIO:8080
      JWT_SECRET: troque-esta-chave-por-uma-aleatoria-longa
      STREAM_MODE: redirect       # ou proxy
      TRIAL_HOURS: 6
      DB_PATH: /app/data/panel.db
      M3U_PATH: /app/lista.m3u
