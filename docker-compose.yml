services:
  painel:
    build: .
    container_name: clm-iptv
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data          # banco de dados
      - ./lista.m3u:/app/lista.m3u:ro
    env_file:
      - .env                      # JWT_SECRET, STREAM_MODE, TRIAL_HOURS etc.
    environment:
      PORT: 8080
      HOST: 0.0.0.0               # escuta em todas as interfaces do container
      # dominio/IP que os clientes vao acessar (sobrescreve o do .env se precisar)
      PUBLIC_URL: http://129.213.129.0:8080
      DB_PATH: /app/data/panel.db
      M3U_PATH: /app/lista.m3u
